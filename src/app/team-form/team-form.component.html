<h1 style = "text-align: center;">Team Analysis Tool</h1>
<p>Paste team:</p>
<form [formGroup] = "checkoutForm" (ngSubmit) = "onSubmit()">
    <textarea name = "team" id = "team" formControlName = "team" rows = "25" cols = "100"></textarea>
    <button class = "button-submit" type = "submit">Submit</button>
</form>
